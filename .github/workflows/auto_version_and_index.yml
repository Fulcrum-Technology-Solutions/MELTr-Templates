# Sync collection.json versions and TEMPLATES.yaml after template edits.
# Opens a PR (audit trail) then squash-merges it via a GitHub App token so
# ruleset review / unattributed-commit gates do not block the bot.
# GitHub Releases run separately when bumped collection.json lands on main —
# see template_collection_release.yml.
#
# Requires repo secrets:
#   MELTR_TEMPLATES_SYNC_APP_ID
#   MELTR_TEMPLATES_SYNC_APP_PRIVATE_KEY
# And main-protect ruleset bypass for that GitHub App.
name: Auto Version and Update Index

on:
  push:
    branches: [ main ]
    paths:
      - 'templates/**/*.j2'
      - 'templates/**/*.meta.yaml'
      - 'templates/**/vendor.meta.yaml'
      - 'templates/**/product.meta.yaml'
      - 'templates/**/collection.json'
  workflow_dispatch:

concurrency:
  group: template-auto-sync-pr
  cancel-in-progress: false

jobs:
  sync-versions-and-index:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MELTR_TEMPLATES_SYNC_APP_ID }}
          private-key: ${{ secrets.MELTR_TEMPLATES_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # auto_version.py compares HEAD~1..HEAD
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # Bump templates/**/collection.json when .j2 / meta / etc. changed on this push.
      - name: Auto-version collections
        run: python .github/scripts/auto_version.py
        continue-on-error: true

      - name: Install dependencies for index
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Update TEMPLATES.yaml
        run: python .github/scripts/update_templates_index.py

      # Post-merge of this bot PR, this workflow may run again with only collection.json
      # changes; auto_version usually no-ops and there is no PR to open — no harm.
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: sync collection versions and TEMPLATES index"
          title: "chore: sync collection versions and TEMPLATES index"
          body: |
            Automated sync after template changes on `main`.

            - `auto_version.py` may bump `templates/**/collection.json`
            - `update_templates_index.py` refreshes `TEMPLATES.yaml`

            This PR is squash-merged by the sync GitHub App when ready.
          branch: bot/auto-sync-templates
          delete-branch: false

      - name: Automerge sync PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pr="${{ steps.cpr.outputs.pull-request-number }}"
          # Prefer queued auto-merge (waits for required checks if configured).
          # Fall back to immediate squash merge when auto-merge is disabled on the repo
          # or when the App's ruleset bypass allows merge without waiting.
          if gh pr merge --squash --auto "$pr"; then
            echo "Auto-merge enabled for #$pr"
          else
            echo "Auto-merge unavailable; squash-merging #$pr now"
            gh pr merge --squash "$pr"
          fi
