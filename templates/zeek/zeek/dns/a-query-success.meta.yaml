    icon: 📋
    color_scheme: info
  overview:
    summary: 'One independent successful UDP IN/A exchange with one answer. Uses schema-standard registry fields plus generated vendor-specific IDs. Works with the default MELTr entity sample.yaml;
      example configuration: configs/zeek/zeek/dns.yaml. Tested with MELTr rc3 commit 1e14e5defb66f6ac24decbe59c1c4f4e64877618.
      Entity fixtures must be selected per source; generic registry preview entities are not sufficient.'
    when_generated:
    - A recursive DNS query returns one A record.
    frequency_notes: One event/second test rate; no connection reuse, conn.log correlation or packet simulation.
    security_relevance: Informational
    compliance_frameworks: []
