    summary: 'First logs[] member of the documented v1.1 configuration-log response. Uses schema-standard registry fields plus generated vendor-specific IDs. Works with the default MELTr entity sample.yaml; example configuration: configs/tailscale/tailnet/configuration-audit.yaml.
