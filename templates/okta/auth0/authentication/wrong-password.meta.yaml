vendor: okta
product: auth0
data_source: authentication
description: Auth0 database authentication failure caused by a wrong password; registry identities and application,
  fresh UTC time and synthetic log identifiers.
format: JSON
is_generator: true
base_frequency: 3600
business_hours_multiplier: 1.0
night_hours_multiplier: 1.0
weekend_multiplier: 1.0
documentation:
  display:
    title: Auth0 wrong-password authentication
    tags:
    - auth0
    - authentication
    - database
    - fp
    icon: 📋
    color_scheme: info
  overview:
    summary: 'One documented fp scenario, with required registry fixture relationships. Requires source-specific
      entities: entities/okta/auth0/authentication.yaml; example configuration: configs/okta/auth0/authentication.yaml.
      Tested with MELTr rc3 commit 1e14e5defb66f6ac24decbe59c1c4f4e64877618. Entity fixtures must be selected per
      source; generic registry preview entities are not sufficient.'
    when_generated:
    - A known database user supplies an incorrect password.
    frequency_notes: Local test rate of 3600 events/hour. Example generator stops after five events.
    security_relevance: Informational
    compliance_frameworks: []
  resources:
    documentation:
    - title: Auth0 log structure and failed-login example
      url: https://auth0.com/docs/secure/security-guidance/incident-response-using-logs
      type: official
    tools: []
  fields:
  - name: date
    type: String
    description: 'Jinja: one `now()` value, serialized with MELTr `iso8601_utc` and sliced to milliseconds Fresh
      UTC ISO timestamp with milliseconds; test clock injection is confined to validation.'
    template_source: 'Jinja: one `now()` value, serialized with MELTr `iso8601_utc` and sliced to milliseconds Fresh
      UTC ISO timestamp with milliseconds; test clock injection is confined to validation.'
    example_value: '2026-10-01T22:48:18.924Z'
  - name: type
    type: String
    description: Fixed `fp` Only the documented wrong-password branch.
    template_source: Fixed `fp` Only the documented wrong-password branch.
    example_value: fp
  - name: description
    type: String
    description: Fixed `Wrong email or password.` Same message as details.error.message.
    template_source: Fixed `Wrong email or password.` Same message as details.error.message.
    example_value: Wrong email or password.
  - name: connection
    type: String
    description: Fixed `Username-Password-Authentication` One database connection in this profile.
    template_source: Fixed `Username-Password-Authentication` One database connection in this profile.
    example_value: Username-Password-Authentication
  - name: connection_id
    type: String
    description: Fixed `con_ExampleLab01` Synthetic fixture identity for that connection.
    template_source: Fixed `con_ExampleLab01` Synthetic fixture identity for that connection.
    example_value: con_ExampleLab01
  - name: client_id
    type: String
    description: 'Registry: named service.service_id Stable per application; local alphanumeric/underscore/hyphen
      constraint.'
    template_source: 'Registry: named service.service_id Stable per application; local alphanumeric/underscore/hyphen
      constraint.'
    example_value: ExampleLabClient01
  - name: client_name
    type: String
    description: 'Registry: same service.description Nonempty display name; JSON escaping preserves special characters.'
    template_source: 'Registry: same service.description Nonempty display name; JSON escaping preserves special
      characters.'
    example_value: Example Customer Portal
  - name: ip
    type: String
    description: 'Registry: selected user’s named browser device.ip_address IPv4; fixtures use documentation addresses.'
    template_source: 'Registry: selected user’s named browser device.ip_address IPv4; fixtures use documentation
      addresses.'
    example_value: 192.0.2.21
  - name: user_agent
    type: String
    description: Fixed documented Chrome/macOS string Historical profile, not a current-browser claim; fixture device
      must match.
    template_source: Fixed documented Chrome/macOS string Historical profile, not a current-browser claim; fixture
      device must match.
    example_value: Chrome 86.0.4240 / Mac OS X 10.15.6
  - name: details
    type: Object
    description: Jinja dictionary Contains only error for this scenario.
    template_source: Jinja dictionary Contains only error for this scenario.
    example_value: '{"error":{"message":"Wrong email or password."}}'
  - name: details.error
    type: Object
    description: Jinja dictionary Contains only message for this scenario.
    template_source: Jinja dictionary Contains only message for this scenario.
    example_value: '{"message":"Wrong email or password."}'
  - name: details.error.message
    type: String
    description: Fixed wrong-password message Agrees with description.
    template_source: Fixed wrong-password message Agrees with description.
    example_value: Wrong email or password.
  - name: user_id
    type: String
    description: 'Jinja: `auth0|` plus registry user.user_id Stable across events for the selected user; synthetic
      mapping, not a provisioned Auth0 account.'
    template_source: 'Jinja: `auth0|` plus registry user.user_id Stable across events for the selected user; synthetic
      mapping, not a provisioned Auth0 account.'
    example_value: auth0|37f967cdbf8ebf2727378558
  - name: user_name
    type: String
    description: 'Registry: same user.email MELTr-valid email; no example.com-only restriction.'
    template_source: 'Registry: same user.email MELTr-valid email; no example.com-only restriction.'
    example_value: ben.rivera@example.com
  - name: strategy
    type: String
    description: Fixed `auth0` Database connection profile.
    template_source: Fixed `auth0` Database connection profile.
    example_value: auth0
  - name: strategy_type
    type: String
    description: Fixed `database` Paired with strategy and connection.
    template_source: Fixed `database` Paired with strategy and connection.
    example_value: database
  - name: log_id
    type: String
    description: 'Faker: `fake.numerify`, one call/event 57-digit synthetic value starting with 9; local test representation,
      not Auth0’s ID algorithm. Randomness is not a global uniqueness guarantee.'
    template_source: 'Faker: `fake.numerify`, one call/event 57-digit synthetic value starting with 9; local test
      representation, not Auth0’s ID algorithm. Randomness is not a global uniqueness guarantee.'
    example_value: '976779132038249620293929323493172846334245207770795734897'
  - name: _id
    type: String
    description: Reuse event log_id Identical to log_id; included only because the reference example includes it.
    template_source: Reuse event log_id Identical to log_id; included only because the reference example includes
      it.
    example_value: '976779132038249620293929323493172846334245207770795734897'
  - name: isMobile
    type: Boolean
    description: Fixed Jinja `false` Desktop browser profile; emitted as a JSON boolean.
    template_source: Fixed Jinja `false` Desktop browser profile; emitted as a JSON boolean.
    example_value: 'false'
