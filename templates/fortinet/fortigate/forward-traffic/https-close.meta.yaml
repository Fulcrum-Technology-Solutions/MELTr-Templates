vendor: fortinet
product: fortigate
data_source: forward-traffic
description: Historical FortiOS HTTPS close sample profile, 48 raw key=value fields, registry endpoint/MAC/NAT/policy
  and fresh seconds clock/session/source port.
format: Plain Text
is_generator: true
base_frequency: 3600
business_hours_multiplier: 1.0
night_hours_multiplier: 1.0
weekend_multiplier: 1.0
documentation:
  display:
    title: FortiGate historical HTTPS close
    tags:
    - fortigate
    - traffic
    - https
    icon: 📋
    color_scheme: info
  overview:
    summary: 'Historical raw sample from the 7.6.3 reference, not current default exporter schema. Requires source-specific
      entities: entities/fortinet/fortigate/forward-traffic.yaml; example configuration: configs/fortinet/fortigate/forward-traffic.yaml.
      Tested with MELTr rc3 commit 1e14e5defb66f6ac24decbe59c1c4f4e64877618. Entity fixtures must be selected per
      source; generic registry preview entities are not sufficient.'
    when_generated:
    - An HTTPS TCP session closes.
    frequency_notes: One event/second test rate; independent session summaries, fixed sample counters.
    security_relevance: Informational
    compliance_frameworks: []
  resources:
    documentation:
    - title: 'Official reference: samples, field definitions and ID 13'
      url: https://fortinetweb.s3.amazonaws.com/docs.fortinet.com/v2/attachments/39c2a34e-fde8-11ef-b13a-ca4255feedd9/FortiOS_7.6.3_Log_Reference.pdf
      type: official
    tools: []
