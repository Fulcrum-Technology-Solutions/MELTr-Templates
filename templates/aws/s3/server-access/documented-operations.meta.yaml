    icon: 📋
    color_scheme: info
  overview:
    summary: '27-field published example profile; three complete scenario branches. Requires source-specific entities:
      entities/aws/s3/server-access.yaml; example configuration: configs/aws/s3/server-access.yaml. Tested with
      MELTr rc3 commit 1e14e5defb66f6ac24decbe59c1c4f4e64877618. Entity fixtures must be selected per source; generic
      registry preview entities are not sufficient.'
    when_generated:
    - Logging-status GET, missing-policy GET or successful object PUT.
    frequency_notes: 3600/hour test rate; equal synthetic branch selection is not measured traffic.
    security_relevance: Informational
    compliance_frameworks: []
  resources:
