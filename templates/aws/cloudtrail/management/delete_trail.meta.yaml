vendor: aws
product: cloudtrail
data_source: management
description: "AWS CloudTrail DeleteTrail management event"
format: "JSON"
frequency: "low"
is_generator: true
base_frequency: 5
time_patterns:
  - business_hours
  - night_hours
  - weekend
business_hours_multiplier: 2.0
night_hours_multiplier: 0.3
weekend_multiplier: 0.1

documentation:
  display:
    title: "CloudTrail Delete Trail Event"
    subtitle: "Management API call to delete a CloudTrail trail"
    icon: "🗑️"
    color_scheme: "warning"
    tags:
      - "aws"
      - "cloudtrail"
      - "management"
      - "delete"
      - "audit"
      - "compliance"

  overview:
    summary: "Records when an AWS CloudTrail trail is deleted via the DeleteTrail API. The event is the native CloudTrail management record. DeleteTrail returns an empty body, so responseElements is null."
    when_generated:
      - "When a user or service deletes a CloudTrail trail via AWS Console"
      - "When DeleteTrail API is called programmatically"
      - "During automated cleanup processes"
      - "When trails are removed due to cost optimization"
    security_relevance: "High"
    compliance_frameworks:
      - "SOC 2"
      - "PCI DSS"
      - "HIPAA"
      - "SOX"
      - "FedRAMP"
    frequency_notes: "Low frequency event - trail deletions are typically infrequent administrative actions"

  fields:
    - name: "eventVersion"
      type: "String"
      required: true
      description: "CloudTrail event format version"
      example_value: "1.08"
      template_source: "1.08 or 1.10, the versions in published DeleteTrail records. Both include eventCategory and tlsDetails."
      possible_values:
        - value: "1.08"
          description: "DeleteTrail sample with TLSv1.2"
        - value: "1.10"
          description: "DeleteTrail sample with TLSv1.3"

    - name: "userIdentity.principalId"
      type: "String"
      required: true
      description: "Unique identifier for the principal"
      example_value: "AIDAYTOGP2RLEHRX5YWNV"
      template_source: "IAM user is AIDA plus 17 characters. Assumed role is AROA plus 17 characters, a colon, and the session name."
      notes: "eventTime is UTC with a Z suffix. creationDate is yyyyMMddTHHmmssZ."

    - name: "eventName"
      type: "String"
      required: true
      description: "The CloudTrail API operation name"
      example_value: "DeleteTrail"
      template_source: "Static value"

    - name: "requestParameters.name"
      type: "String"
      required: true
      description: "Name of the trail sent to DeleteTrail. The API also accepts a trail ARN. Published records use the trail name."
      example_value: "redatomictesttrail"
      template_source: "Random selection from common trail names"

    - name: "responseElements"
      type: "Object"
      required: true
      description: "DeleteTrail returns HTTP 200 with an empty body, so this is null on success and on error."
      example_value: "null"
      template_source: "Static null"

    - name: "errorCode"
      type: "String"
      required: false
      description: "Error code when the delete fails"
      example_value: "TrailNotFoundException"
      template_source: "Random selection when an error occurs"
      possible_values:
        - value: "TrailNotFoundException"
          description: "The named trail does not exist"
        - value: "InvalidTrailNameException"
          description: "The trail name is not valid"
        - value: "AccessDenied"
          description: "The caller is not allowed to delete the trail"

    - name: "awsRegion"
      type: "String"
      required: true
      description: "Region where DeleteTrail was called. The call must be made in the trail home region."
      example_value: "us-west-2"
      template_source: "Random commercial region"

    - name: "sourceIPAddress"
      type: "String"
      required: true
      description: "IP address of the API caller"
      example_value: "192.184.242.57"
      template_source: "Public address. vpcEndpointId is omitted."

    - name: "tlsDetails"
      type: "Object"
      required: false
      description: "TLS details for a direct client call"
      example_value: '{"tlsVersion": "TLSv1.2", "cipherSuite": "ECDHE-RSA-AES128-GCM-SHA256", "clientProvidedHostHeader": "cloudtrail.us-west-2.amazonaws.com"}'
      template_source: "tlsVersion 1.2 uses an ECDHE-RSA cipher. tlsVersion 1.3 uses a TLS_AES cipher."
      notes: "Omitted when sessionCredentialFromConsole is true. clientProvidedHostHeader is the regional CloudTrail endpoint."

    - name: "managementEvent"
      type: "Boolean"
      required: true
      description: "DeleteTrail is a management event"
      example_value: "true"
      template_source: "Static true"

  resources:
    documentation:
      - title: "CloudTrail record contents"
        url: "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html"
        type: "official"
      - title: "DeleteTrail API"
        url: "https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_DeleteTrail.html"
        type: "official"
      - title: "CloudTrail userIdentity element"
        url: "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html"
        type: "official"

    tools:
      - name: "AWS CloudTrail Console"
        description: "Web interface for managing CloudTrail trails and viewing events"
        url: "https://console.aws.amazon.com/cloudtrail/"
      - name: "AWS CLI"
        description: "Command-line interface for AWS services including CloudTrail"
        url: "https://aws.amazon.com/cli/"
