  overview:
    summary: 'Raw IPv4/TCP filterlog body with preserved empty fields. Requires source-specific entities: entities/netgate/pfsense/filter.yaml;
      example configuration: configs/netgate/pfsense/filter.yaml. Tested with MELTr rc3 commit 1e14e5defb66f6ac24decbe59c1c4f4e64877618.
      Entity fixtures must be selected per source; generic registry preview entities are not sufficient.'
